<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10151f">
<title>Merge Racers</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #10151f; overflow: hidden; }
  canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #sa { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden;
        padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #modal { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center;
           background: rgba(5, 8, 15, 0.72); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff;
           -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #modal.hidden { display: none; }
  #card { box-sizing: border-box; width: 100%; max-width: 440px; max-height: 92vh; overflow-y: auto;
          background: #1a2236; border-radius: 22px 22px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px));
          box-shadow: 0 -6px 30px rgba(0, 0, 0, 0.5); }
  #card h2 { margin: 0 0 6px; font-size: 22px; text-align: center; }
  #card p { margin: 6px 0; font-size: 14px; line-height: 1.35; color: #b8c2dc; text-align: center; }
  #card .big { font-size: 32px; font-weight: 800; color: #ffd45a; text-align: center; margin: 8px 0 2px; }
  #card .small { font-size: 12px; color: #8390ad; }
  .btn { display: block; width: 100%; box-sizing: border-box; margin-top: 10px; padding: 14px 12px; border: 0; border-radius: 14px;
         font-size: 17px; font-weight: 700; color: #fff; background: linear-gradient(#4ade80, #16a34a); cursor: pointer; }
  .btn.blue { background: linear-gradient(#4aa8ff, #2563d6); }
  .btn.alt { background: #34405e; }
  .btn.red { background: linear-gradient(#ff6a6a, #c71f2e); }
  .btn.gold { background: linear-gradient(#ffe066, #f59f00); color: #3a2a00; }
  .btn:disabled { opacity: 0.45; }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); font-size: 16px; }
  .tog { min-width: 64px; padding: 8px 12px; border: 0; border-radius: 20px; font-weight: 700; font-size: 14px; color: #fff; background: #34405e; }
  .tog.on { background: #16a34a; }
  .trk { margin: 10px 0; padding: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 14px; }
  .trk canvas { width: 100%; height: auto; border-radius: 10px; display: block; }
  .trk .nm { display: flex; justify-content: space-between; margin-top: 8px; font-weight: 700; }
  .trk .nm span:last-child { color: #ffd45a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<div id="modal" class="hidden"><div id="card"></div></div>
<script src="config.js"></script>
<script src="strings.js"></script>
<script src="core.js"></script>
<script src="adservice.js"></script>
<script src="audio.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>
</body>
</html>
